server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Default nginx is 1m; that 413s before the API DOCUMENT_MAX_BYTES check.
  # 65m covers the 64 MiB hard max plus multipart overhead.
  client_max_body_size 65m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_request_buffering off;
    client_max_body_size 65m;
    # Indexing a 400+ page PDF waits on the API until the pipeline finishes
    # (INDEX_PIPELINE_TIMEOUT_SECONDS, hard max 900s). Default nginx is 60s.
    proxy_connect_timeout 10s;
    proxy_send_timeout 960s;
    proxy_read_timeout 960s;
  }

  location / {
    try_files $uri /index.html;
  }
}
