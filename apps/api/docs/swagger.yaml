      - application/json
      responses:
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Deprecated — use POST /turns
      tags:
      - sessions
  /api/v1/sessions/{sessionId}/turns:
    post:
      consumes:
      - application/json
      description: Atomically saves USER+ASSISTANT. Actions include ASK_MISSING_SLOTS,
        DIRECT_ANSWER, PROVIDE_FINAL_GUIDANCE, OUT_OF_SCOPE, CONFIRM_INTENT. Idempotent
        via X-Request-ID bound to normalized message hash; same ID + different body
        → 409 IDEMPOTENCY_CONFLICT.
      parameters:
      - description: Session UUID
        in: path
        name: sessionId
        required: true
        type: string
      - description: Bearer access token
        in: header
        name: Authorization
        type: string
      - description: Guest token from session create
        in: header
        name: X-Guest-Token
        type: string
      - description: Idempotency key (UUID)
        in: header
        name: X-Request-ID
        required: true
        type: string
      - description: User message
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/session.createMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Run one citizen chat turn
      tags:
      - sessions
