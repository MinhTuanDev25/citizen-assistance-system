basePath: /
consumes:
- application/json
definitions:
  authapi.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  authapi.registerRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  documentapi.DocumentLinkRequest:
    properties:
      page_range:
        type: string
      procedure_version_id:
        type: string
      relationship_type:
        type: string
    type: object
  handler.liveResponse:
    properties:
      status:
        example: OK
        type: string
    type: object
  handler.readyResponse:
    properties:
      checks:
        additionalProperties:
          type: string
        type: object
      status:
        example: READY
        type: string
    type: object
  repository.DomainCreate:
    properties:
      description:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      sort_order:
        type: integer
    required:
    - id
    - name
    type: object
  repository.DomainUpdate:
    properties:
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      sort_order:
        type: integer
    type: object
  response.Envelope:
    properties:
      data: {}
      error:
        $ref: '#/definitions/response.Error'
      request_id:
        type: string
    type: object
  response.Error:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  session.createMessageRequest:
    properties:
      message:
        type: string
    required:
    - message
    type: object
  session.createRequest:
    properties:
      guest_token:
        type: string
      xa_id:
        type: string
    required:
    - xa_id
    type: object
info:
  contact: {}
  description: Backend API for commune citizen assistance (Chư Sê).
  title: Citizen Assistance API
  version: "1.0"
paths:
  /api/v1/admin/documents:
    get:
      parameters:
      - description: Domain id
        in: query
        name: domain_id
        type: string
      - description: UPLOADED, PROCESSING, PROCESSED, READY, or FAILED
        in: query
        name: processing_status
        type: string
      - description: PENDING, VALID, EXPIRED, or SUPERSEDED
        in: query
        name: validity_status
        type: string
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Page offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: List admin documents for this commune
      tags:
      - admin-documents
    post:
      consumes:
      - multipart/form-data
      description: Admin JWT required. Stores one application/pdf. Client xa_id is
        ignored.
      parameters:
      - description: PDF file
        in: formData
        name: file
        required: true
        type: file
      - description: Title
        in: formData
        name: title
        required: true
        type: string
      - description: Active domain id
        in: formData
        name: domain_id
        required: true
        type: string
      - description: Document number
        in: formData
        name: document_number
        type: string
      - description: Issuer
        in: formData
        name: issuer
        type: string
      - description: Effective date YYYY-MM-DD
        in: formData
        name: effective_date
        type: string
      - description: Expire date YYYY-MM-DD
        in: formData
        name: expire_date
        type: string
      - description: Issued date YYYY-MM-DD
        in: formData
        name: issued_date
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Upload an admin PDF
      tags:
      - admin-documents
  /api/v1/admin/documents/{id}:
    get:
      parameters:
      - description: Document id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Get one admin document
      tags:
      - admin-documents
  /api/v1/admin/documents/{id}/content:
    get:
      parameters:
      - description: Document id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/pdf
      responses:
        "200":
          description: OK
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Download the stored PDF
      tags:
      - admin-documents
  /api/v1/admin/documents/{id}/links:
    get:
      description: Returns per-link index status. READY links include page_count,
        chunk_count, ocr_page_count, pipeline_version, and embedding_model_id from
        the active generation only. Staging generations are not returned.
      parameters:
