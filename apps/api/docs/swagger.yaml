        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: List procedure versions attached to a document
      tags:
      - admin-documents
    post:
      consumes:
      - application/json
      parameters:
      - description: Document id
        in: path
        name: id
        required: true
        type: string
      - description: Idempotency key
        in: header
        name: X-Request-ID
        required: true
        type: string
      - description: Link
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/documentapi.DocumentLinkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Attach a document to a procedure version
      tags:
      - admin-documents
  /api/v1/admin/documents/{id}/links/{versionId}:
    delete:
      parameters:
      - description: Document id
        in: path
        name: id
        required: true
        type: string
      - description: Procedure version id
        in: path
        name: versionId
        required: true
        type: string
      - description: Idempotency key
        in: header
        name: X-Request-ID
        required: true
        type: string
      produces:
