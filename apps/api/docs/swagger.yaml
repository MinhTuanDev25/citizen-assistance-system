      parameters:
      - description: Session UUID
        in: path
        name: sessionId
        required: true
        type: string
      - description: Bearer access token
        in: header
        name: Authorization
        type: string
      - description: Guest token from session create
        in: header
        name: X-Guest-Token
        type: string
