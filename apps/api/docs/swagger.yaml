basePath: /
consumes:
- application/json
definitions:
  github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_repository.DomainCreate:
    properties:
      description:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      sort_order:
        type: integer
    required:
    - id
    - name
    type: object
  github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_repository.DomainUpdate:
    properties:
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      sort_order:
        type: integer
    type: object
  github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope:
    properties:
      data: {}
      error:
        $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Error'
      request_id:
        type: string
    type: object
  github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Error:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  internal_api_http_v1_auth.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_api_http_v1_auth.registerRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  internal_api_http_v1_session.createMessageRequest:
    properties:
      message:
        type: string
    required:
    - message
    type: object
  internal_api_http_v1_session.createRequest:
    properties:
      guest_token:
        type: string
      xa_id:
        type: string
    required:
    - xa_id
    type: object
  internal_handler.liveResponse:
    properties:
      status:
        example: OK
        type: string
    type: object
  internal_handler.readyResponse:
    properties:
      checks:
        additionalProperties:
          type: string
        type: object
      status:
        example: READY
        type: string
    type: object
info:
  contact: {}
  description: Backend API for commune citizen assistance (Chư Sê).
  title: Citizen Assistance API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api_http_v1_auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
      summary: Login (citizen or admin)
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: Stateless JWT — server acknowledges logout; FE must delete access_token.
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
      security:
      - BearerAuth: []
      summary: Logout (client discards token)
      tags:
      - auth
  /api/v1/auth/me:
    get:
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
      security:
      - BearerAuth: []
      summary: Current user profile
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Citizen registration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api_http_v1_auth.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
      summary: Register citizen account
      tags:
      - auth
  /api/v1/communes:
    get:
      parameters:
      - description: Filter active only (true)
        in: query
        name: active
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
      summary: List communes
      tags:
      - communes
  /api/v1/communes/{id}:
    get:
      parameters:
      - description: Commune id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
      summary: Get commune by id
      tags:
      - communes
  /api/v1/domains:
    get:
      parameters:
      - description: Filter active only (true)
        in: query
        name: active
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
      summary: List domains
      tags:
      - domains
    post:
      consumes:
      - application/json
      parameters:
      - description: Domain payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_repository.DomainCreate'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
      summary: Create domain
      tags:
      - domains
  /api/v1/domains/{id}:
    delete:
      parameters:
      - description: Domain id
        in: path
        name: id
        required: true
        type: string
      - description: Set true for hard delete
        in: query
        name: hard
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
      summary: Delete domain (soft by default)
      tags:
      - domains
    get:
      parameters:
      - description: Domain id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
      summary: Get domain by id
      tags:
      - domains
    put:
      consumes:
      - application/json
      parameters:
      - description: Domain id
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_repository.DomainUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
      summary: Update domain
      tags:
      - domains
  /api/v1/procedures:
    get:
      parameters:
      - description: Commune id (default from config)
        in: query
        name: xa_id
        type: string
      - description: Filter by domain id
        in: query
        name: domain_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
      summary: List ACTIVE procedures grouped by domain
      tags:
      - procedures
  /api/v1/procedures/{id}/active-version:
    get:
      parameters:
      - description: Procedure UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
      summary: Get ACTIVE version + definition
      tags:
      - procedures
  /api/v1/procedures/by-code/{code}:
    get:
      parameters:
      - description: procedure_code
        in: path
        name: code
        required: true
        type: string
      - description: Commune id (default from config)
        in: query
        name: xa_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
      summary: Resolve procedure by code
      tags:
      - procedures
  /api/v1/sessions:
    post:
      consumes:
      - application/json
      description: 'Guest: omit Authorization, optional guest_token resume. Logged-in:
        Bearer JWT → user_id set, no guest_token.'
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        type: string
      - description: xa_id required; guest_token optional (guest only)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api_http_v1_session.createRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
      summary: Create conversation session
      tags:
      - sessions
  /api/v1/sessions/{sessionId}/messages:
    get:
      description: Oldest→newest. FE maps role USER→user bubble, ASSISTANT→bot bubble.
      parameters:
      - description: Session UUID
        in: path
        name: sessionId
        required: true
        type: string
      - description: Guest token from session create
        in: header
        name: X-Guest-Token
        required: true
        type: string
      - description: Max messages (default 100, max 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
      summary: List messages for chat UI
      tags:
      - sessions
    post:
      consumes:
      - application/json
      description: Persists user message. Chat turn / Decision Engine will be added
        next.
      parameters:
      - description: Session UUID
        in: path
        name: sessionId
        required: true
        type: string
      - description: Guest token from session create
        in: header
        name: X-Guest-Token
        required: true
        type: string
      - description: User message
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api_http_v1_session.createMessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MinhTuanDev25_citizen-assistance-system_apps_api_internal_response.Envelope'
      summary: Append USER message to session
      tags:
      - sessions
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.liveResponse'
      summary: Liveness probe
      tags:
      - health
  /ready:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.readyResponse'
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Readiness probe
      tags:
      - health
produces:
- application/json
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
