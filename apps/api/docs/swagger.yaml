  /api/v1/procedures:
    get:
      description: 'Default / citizen=true: public CitizenDomainIDs only. citizen=false:
        full ACTIVE catalog — ADMIN JWT required (not a public privilege flag). Invalid
        citizen values → 400.'
      parameters:
      - description: Commune id (default from config)
        in: query
        name: xa_id
        type: string
      - description: Filter by domain id
        in: query
        name: domain_id
        type: string
      - description: 'true/omit: CitizenDomainIDs; false: admin full catalog'
