# Local / V1 stack (skeleton — wire services in Phase 1)

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cas
      POSTGRES_PASSWORD: cas
      POSTGRES_DB: citizen_assistance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # api:
  #   build: ../apps/api
  #   ports: ["8080:8080"]
  #   depends_on: [postgres, ai-service]

  # ai-service:
  #   build: ../apps/ai-service
  #   ports: ["8001:8000"]
  #   depends_on: [postgres]

  # web:
  #   build: ../apps/web
  #   ports: ["3000:80"]
  #   depends_on: [api]

volumes:
  pgdata:
  miniodata:
