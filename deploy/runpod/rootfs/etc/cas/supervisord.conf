; Process manager of the all-in-one pod. Started by entrypoint.sh (exec) under tini.
; supervisord orders starts (priority) but does not wait for readiness:
; bootstrap waits for the data services, and every app program is wrapped in
; wait-for.sh so it only execs after bootstrap.ok of this boot exists.
; Shutdown runs in reverse priority (nginx first, data services, pg-lease last).
;
; Every program is started as root by supervisord through
;   svc-run <service> <user> <command...>
; which clears the environment (env -i), loads only /run/cas-env/<service>.env
; (allowlist written by entrypoint.sh) and drops to <user> with gosu. No program
; inherits the secrets of another one. Do not add user= or environment= here.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
childlogdir=/run/cas-log

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; ---- workspace lease (single writer) ------------------------------------------
; Started first and stopped last (lowest priority). Heartbeat + fencing; releases
; the lease on clean shutdown only after the data services have stopped.

[program:pg-lease]
priority=5
command=/opt/cas/bin/svc-run pg-lease root /opt/cas/bin/pg-lease.sh
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---- data services (each refuses to start without this container's fresh lease) --

[program:postgres]
priority=10
command=/opt/cas/bin/svc-run postgres postgres /opt/cas/bin/pg-start.sh /usr/lib/postgresql/16/bin/postgres -D /workspace/cas/pgdata
autorestart=true
startsecs=3
; SIGINT = fast shutdown (rolls back open transactions, writes a checkpoint)
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:qdrant]
priority=10
directory=/opt/cas/qdrant
command=/opt/cas/bin/svc-run qdrant qdrant /opt/cas/bin/pg-start.sh /opt/cas/qdrant/qdrant
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:minio]
priority=10
command=/opt/cas/bin/svc-run minio minio /opt/cas/bin/pg-start.sh /opt/cas/bin/minio server --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 --certs-dir /workspace/cas/tls/minio /workspace/cas/minio
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---- one-shot bootstrap -----------------------------------------------------
; Expected final state: EXITED with exit code 0 (not RUNNING).

[program:bootstrap]
priority=20
command=/opt/cas/bin/svc-run bootstrap cas /opt/cas/bin/bootstrap.sh
autostart=true
autorestart=false
startsecs=0
exitcodes=0
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---- application services ---------------------------------------------------

[program:ai-service]
priority=30
directory=/opt/cas/ai
command=/opt/cas/bin/svc-run ai-service cas /opt/cas/bin/wait-for.sh --marker -- /opt/cas/venv-ai/bin/uvicorn app.main:app --host 127.0.0.1 --port 8001
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=30
; the indexing pipeline runs in child processes: stop/kill the whole group
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:speech]
priority=30
directory=/opt/cas/c0
command=/opt/cas/bin/svc-run speech speech /opt/cas/bin/wait-for.sh --marker -- /opt/cas/venv-c0/bin/python -m src.c0_speech
; CAS_SPEECH_AUTOSTART is set by entrypoint.sh from CAS_SPEECH_MODE (off -> false).
autostart=%(ENV_CAS_SPEECH_AUTOSTART)s
autorestart=true
startsecs=10
stopsignal=TERM
stopwaitsecs=40
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
priority=40
directory=/opt/cas/api
command=/opt/cas/bin/svc-run api cas /opt/cas/bin/wait-for.sh --marker --http http://127.0.0.1:8001/ready -- /opt/cas/api/api
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:index-reaper]
priority=45
directory=/opt/cas/api
command=/opt/cas/bin/svc-run index-reaper cas /opt/cas/bin/wait-for.sh --marker -- /opt/cas/api/index-reaper
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=45
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
priority=50
command=/opt/cas/bin/svc-run nginx web /opt/cas/bin/wait-for.sh --http http://127.0.0.1:8080/ready -- /usr/sbin/nginx -e stderr -c /etc/cas/nginx.conf -g "daemon off;"
autorestart=true
startsecs=3
stopsignal=QUIT
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
