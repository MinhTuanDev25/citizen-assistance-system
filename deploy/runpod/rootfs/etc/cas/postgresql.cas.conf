# Included from pgdata/postgresql.conf by entrypoint.sh. Loopback only, TLS on.
# pgdata lives on the container disk (/var/lib/cas); the durable copy is the WAL that
# pg_receivewal writes to the network volume (see pg-receivewal.sh).
listen_addresses = '127.0.0.1'
port = 5432
unix_socket_directories = '/run/postgresql'
max_connections = 100
password_encryption = 'scram-sha-256'

ssl = on
ssl_cert_file = '/var/lib/cas/tls/postgres/server.crt'
ssl_key_file = '/var/lib/cas/tls/postgres/server.key'
ssl_min_protocol_version = 'TLSv1.2'

# Synchronous WAL to the volume. A COMMIT returns only after the receiver
# (application_name cas_vol, pg_receivewal --synchronous) has fsynced its WAL on the
# volume. With the receiver down, commits wait: never silently asynchronous.
wal_level = replica
max_wal_senders = 4
max_replication_slots = 4
synchronous_standby_names = 'cas_vol'
synchronous_commit = on
# The slot keeps unconfirmed WAL on the container disk; bounded so that a receiver
# that is gone for long cannot fill the disk (the slot is then lost: cas-keeper
# reports it, and a new base backup and slot are needed).
max_slot_wal_keep_size = 4GB
wal_keep_size = 0
full_page_writes = on
wal_log_hints = on

shared_buffers = 256MB
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %u@%d '
log_connections = off
log_min_duration_statement = 2000
