# Public entry point of the all-in-one pod. Runs as user "web" (no root):
# port 8088 > 1024. TLS terminates at the RunPod HTTPS proxy (Cloudflare),
# which cuts requests at 100 s, so upstream timeouts stay below that.
worker_processes 2;
pid /run/nginx/nginx.pid;
# Non-root nginx cannot reopen /dev/stderr (a root-owned supervisord pipe);
# "stderr" writes to the inherited fd 2 instead.
error_log stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Same limit for stdout. Every /api request is logged by the Go API (ApiLog).
  access_log off;
  server_tokens off;
  sendfile on;

  client_body_temp_path /run/nginx/client_body;
  proxy_temp_path /run/nginx/proxy;
  fastcgi_temp_path /run/nginx/fastcgi;
  uwsgi_temp_path /run/nginx/uwsgi;
  scgi_temp_path /run/nginx/scgi;

  # Behind the RunPod proxy every request comes from the proxy address.
  # Rate-limit on the client IP the proxy forwards. Which header RunPod sets
  # is UNVERIFIED until 8.1-B; fall back to the TCP peer.
  map $http_cf_connecting_ip $cas_client {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
  }
  limit_req_zone $cas_client zone=cas_login:10m rate=10r/m;
  limit_req_zone $cas_client zone=cas_session:10m rate=30r/m;
  limit_req_zone $cas_client zone=cas_turn:10m rate=60r/m;
  limit_req_zone $cas_client zone=cas_speech:10m rate=6r/m;
  limit_req_status 429;

  server {
    listen 0.0.0.0:8088;
    root /opt/cas/web;
    index index.html;

    # 65m covers the 64 MiB hard max of DOCUMENT_MAX_BYTES plus multipart overhead.
    client_max_body_size 65m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_set_header X-Forwarded-For $cas_client;
    proxy_connect_timeout 5s;
    proxy_send_timeout 95s;
    proxy_read_timeout 95s;
    proxy_request_buffering off;

    location = /healthz { proxy_pass http://127.0.0.1:8080/health; }
    location = /readyz  { proxy_pass http://127.0.0.1:8080/ready; }

    # login and register share one bucket per client (brute force, account spam)
    location ~ ^/api/v1/auth/(login|register)$ {
      limit_req zone=cas_login burst=5 nodelay;
      proxy_pass http://127.0.0.1:8080;
    }
    location = /api/v1/sessions {
      limit_req zone=cas_session burst=10 nodelay;
      proxy_pass http://127.0.0.1:8080;
    }
    location ~ ^/api/v1/sessions/[^/]+/speech/translate$ {
      limit_req zone=cas_speech burst=3 nodelay;
      proxy_pass http://127.0.0.1:8080;
    }
    location ~ ^/api/v1/sessions/[^/]+/(turns|messages)$ {
      limit_req zone=cas_turn burst=20 nodelay;
      proxy_pass http://127.0.0.1:8080;
    }
    location /api/ {
      proxy_pass http://127.0.0.1:8080;
    }

    # API docs and anything outside /api stay internal.
    location /swagger { return 404; }

    location / {
      try_files $uri /index.html;
    }
  }
}
