name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cas
          POSTGRES_PASSWORD: cas
          POSTGRES_DB: citizen_assistance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cas -d citizen_assistance"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgres://cas:cas@127.0.0.1:5432/citizen_assistance?sslmode=disable
      CAS_INTEGRATION: "1"
      APP_ENV: local
      JWT_SECRET: ci-jwt-secret-at-least-16chars
      CONFIG_FILE: configs/local/config.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: migrate up
        working-directory: .
        run: |
          docker run --rm --network host \
            -v "$PWD/deploy/migrations:/migrations:ro" \
            migrate/migrate:v4.18.1 \
            -path=/migrations \
            -database "$DATABASE_URL" \
            up
      - name: Go unit tests (no integration tag)
        run: |
          go test ./... -count=1
          go vet ./...
          go build -o /tmp/cas-api ./cmd/api
      - name: Go integration including v10 to latest migration repair
        run: |
          go test -tags=integration ./internal/chat/ ./internal/document/ ./internal/index/ -count=1 -timeout 180s
      - name: MinIO volume persistence
        run: |
          go test -tags=miniopersist ./internal/storage -count=1 -timeout 180s -run TestMinIOVolumeSurvivesContainerRecreate

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: npm ci && vitest && production build + bundle check
        run: |
          npm ci
          npm run test:ci
        env:
          VITE_ADMIN_INGESTION: "false"

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest
        run: |
          pip install -r requirements.txt
          pytest

  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cas
          POSTGRES_PASSWORD: cas
          POSTGRES_DB: citizen_assistance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cas -d citizen_assistance"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: migrate up → seed → down → up (full cycle)
        run: |
          DB='postgres://cas:cas@127.0.0.1:5432/citizen_assistance?sslmode=disable'
          docker run --rm --network host \
            -v "$PWD/deploy/migrations:/migrations:ro" \
            migrate/migrate:v4.18.1 \
            -path=/migrations -database "$DB" up
          docker run --rm --network host postgres:16 \
            psql "$DB" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO conversation_sessions (id, xa_id, guest_token, status) VALUES ('11111111-1111-1111-1111-111111111111','xa_chu_se','mig-guest','OPEN') ON CONFLICT (id) DO NOTHING; INSERT INTO conversation_messages (session_id, request_id, role, content, action) VALUES ('11111111-1111-1111-1111-111111111111','22222222-2222-2222-2222-222222222222','ASSISTANT','confirm?','CONFIRM_INTENT');"
          # down past phase13 + idempotency (2) then re-up; also full empty cycle
          docker run --rm --network host \
            -v "$PWD/deploy/migrations:/migrations:ro" \
            migrate/migrate:v4.18.1 \
            -path=/migrations -database "$DB" down 2
          docker run --rm --network host \
            -v "$PWD/deploy/migrations:/migrations:ro" \
            migrate/migrate:v4.18.1 \
            -path=/migrations -database "$DB" up
          docker run --rm --network host postgres:16 \
            psql 'postgres://cas:cas@127.0.0.1:5432/postgres?sslmode=disable' -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS cas_migrate_empty;" -c "CREATE DATABASE cas_migrate_empty;"
          EMPTY='postgres://cas:cas@127.0.0.1:5432/cas_migrate_empty?sslmode=disable'
          docker run --rm --network host \
            -v "$PWD/deploy/migrations:/migrations:ro" \
            migrate/migrate:v4.18.1 -path=/migrations -database "$EMPTY" up
          docker run --rm --network host \
            -v "$PWD/deploy/migrations:/migrations:ro" \
            migrate/migrate:v4.18.1 -path=/migrations -database "$EMPTY" down 15
          docker run --rm --network host \
            -v "$PWD/deploy/migrations:/migrations:ro" \
            migrate/migrate:v4.18.1 -path=/migrations -database "$EMPTY" up
          docker run --rm --network host postgres:16 \
            psql 'postgres://cas:cas@127.0.0.1:5432/postgres?sslmode=disable' -c "DROP DATABASE IF EXISTS cas_migrate_empty;"
          # Assert seed admin has NULL password_hash after migrations
          docker run --rm --network host postgres:16 \
            psql "$DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT CASE WHEN password_hash IS NULL THEN 'ok' ELSE 'fail' END FROM users WHERE email='admin@chuse.vn';" \
            | grep -q ok

  ai-supervision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: production image process-supervision regression
        run: bash scripts/p4b-container-supervision-test.sh

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        working-directory: deploy
        run: |
          docker compose --profile app config >/dev/null
          docker compose --profile app --profile ai config >/dev/null
          docker compose --profile app --profile storage config | grep -q '/bitnami/minio/data'
          docker compose --profile app --profile storage --profile ai --profile qdrant config > /tmp/p4b-compose.yml
          grep -q '^  ai-service:' /tmp/p4b-compose.yml
          grep -q '^  minio:' /tmp/p4b-compose.yml
          grep -q '^  qdrant:' /tmp/p4b-compose.yml
          grep -q '/bitnami/minio/data' /tmp/p4b-compose.yml
          grep -q 'target: /models/embedding' /tmp/p4b-compose.yml
          grep -q 'target: /models/ocr' /tmp/p4b-compose.yml

  p4b-live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    env:
      CAS_P4B_INTEGRATION: "1"
      CAS_P4B_TEST_COMPOSE_PROJECT: citizen-assistance-p4b-test
      CAS_P4B_TEST_DATABASE_URL: postgres://cas:cas@127.0.0.1:5434/citizen_assistance_p4b_test?sslmode=disable
      CAS_P4B_TEST_BUCKET: cas-p4b-integration-test
      CAS_P4B_TEST_MINIO_ENDPOINT: 127.0.0.1:9010
      CAS_P4B_TEST_MINIO_ACCESS_KEY: minioadmin
      CAS_P4B_TEST_MINIO_SECRET_KEY: minioadmin
      CAS_P4B_TEST_QDRANT_URL: http://127.0.0.1:6335
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: start dedicated test stack
        working-directory: deploy
        run: docker compose -f docker-compose.p4b-test.yml up -d
      - name: wait for test postgres
        run: |
          for i in $(seq 1 40); do
            docker exec citizen-assistance-p4b-test-postgres-1 pg_isready -U cas -d citizen_assistance_p4b_test && exit 0
            sleep 2
          done
          exit 1
      - name: isolation guard refuses development targets
        run: |
          pip install -r requirements.txt
          CAS_P4B_TEST_DATABASE_URL='postgres://cas:cas@127.0.0.1:5432/citizen_assistance?sslmode=disable' \
            pytest tests/test_p4b_isolation.py::test_guard_rejects_development_and_unverified_targets -q
      - name: storage integration on dedicated stack
        run: pytest tests/test_p4b_services.py -q

  production-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: production compose fails closed without secrets
        working-directory: deploy
        run: |
          set +e
          docker compose -f docker-compose.production.yml config >/tmp/prod-missing.txt 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "is required" /tmp/prod-missing.txt
      - name: production compose keeps data services external
        working-directory: deploy
        env:
          CAS_API_IMAGE: cas-api:ci
          CAS_AI_IMAGE: cas-ai:ci
          CAS_WEB_IMAGE: cas-web:ci
          DATABASE_URL: postgres://app:placeholder@db.internal:5432/citizen_assistance?sslmode=verify-full
          JWT_SECRET: ci-prod-jwt-secret-16
          AI_SERVICE_TOKEN: ci-prod-ai-service-token
          XA_ID: xa_chu_se
          OBJECT_STORAGE_ENDPOINT: https://s3api-eu-ro-1.runpod.io
          OBJECT_STORAGE_ACCESS_KEY: ci-access
          OBJECT_STORAGE_SECRET_KEY: ci-secret
          OBJECT_STORAGE_BUCKET: volume-id
          OBJECT_STORAGE_REGION: eu-ro-1
          OBJECT_STORAGE_USE_SSL: "true"
          QDRANT_URL: http://qdrant.internal:6333
          EMBEDDING_MODEL_DIR: /opt/cas/models/embedding
          OCR_MODEL_DIR: /opt/cas/models/ocr
        run: |
          docker compose -f docker-compose.production.yml config >/tmp/prod.yml
          grep -q 'APP_ENV: prod' /tmp/prod.yml
          grep -q 'INDEX_MODE: pipeline' /tmp/prod.yml
          grep -q 'EMBEDDING_PROVIDER: onnx' /tmp/prod.yml
          grep -q 'OCR_PROVIDER: paddle' /tmp/prod.yml
          grep -q 'OBJECT_STORAGE_AUTO_CREATE_BUCKET: "false"' /tmp/prod.yml
          grep -q 'OBJECT_STORAGE_ACCESS_KEY' /tmp/prod.yml
          grep -q 'OBJECT_STORAGE_SECRET_KEY' /tmp/prod.yml
          grep -q '/ready' /tmp/prod.yml
          grep -q 'INDEX_REAPER_INTERVAL_SECONDS' /tmp/prod.yml
          grep -q 'INDEX_REAPER_SHUTDOWN_SECONDS' /tmp/prod.yml
          grep -q 'stop_grace_period: 45s' /tmp/prod.yml
          grep -q 'OBJECT_STORAGE_USE_SSL' /tmp/prod.yml
          grep -q 'host_ip: 127.0.0.1' /tmp/prod.yml
          grep -q 'published: "8080"' /tmp/prod.yml
          ! grep -q '5432:5432' /tmp/prod.yml
          ! grep -q 'published: "5432"' /tmp/prod.yml
          ! grep -q 'published: "6333"' /tmp/prod.yml
          ! grep -q 'published: "9000"' /tmp/prod.yml
