name: runpod-image

# All-in-one image for the RunPod staging pod (deploy/runpod). Native amd64 runner:
# no QEMU. Runs only on demand or on staging-* tags, never on every push.
# Pushing to GHCR is opt-in (input "push") and needs packages: write.
on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image to GHCR after the smoke test passes"
        type: boolean
        default: false
  push:
    tags: ["staging-*"]

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # C0 (bahnar-s2tt-thesis/) is a tracked folder of this repository: checkout is enough.
      - uses: actions/checkout@v4

      - name: stage Speech C0 from committed blobs
        run: deploy/runpod/stage_c0.sh

      - name: fetch_models.sh regression (offline mirror, all-or-nothing publish)
        run: deploy/runpod/tests/fetch_models_test.sh deploy/runpod/tests/out/ci-fetch-models

      - uses: docker/setup-buildx-action@v3

      - name: build linux/amd64
        run: |
          docker buildx build --platform linux/amd64 -f deploy/runpod/Dockerfile \
            --build-arg CAS_REVISION=${GITHUB_SHA} -t cas-aio:${GITHUB_SHA} --load .

      # Every test step below is mandatory: a failure fails the job, and nothing is
      # skipped silently. The checkers exit non-zero on any FAIL.
      - name: Speech C0 level (b) in image
        run: deploy/runpod/tests/c0_in_image.sh cas-aio:${GITHUB_SHA} deploy/runpod/tests/out/ci-c0

      - name: C0 checker negative regression (must detect broken images)
        run: deploy/runpod/tests/c0_in_image_negative.sh cas-aio:${GITHUB_SHA} deploy/runpod/tests/out/ci-c0-negative

      # The ONNX embedding model is not in Git. The image defaults to
      # EMBEDDING_VARIANT=fp32 (runs on any x86_64/arm64 CPU, e.g. RunPod EPYC 7B13
      # without AVX-512 VNNI), so the smoke uses the fp32 model. The int8 model is
      # fetched too when this runner has VNNI, for the real-inference comparison.
      # A checksum mismatch fails the job.
      - name: fetch pinned embedding models
        run: |
          grep -m1 'model name' /proc/cpuinfo
          deploy/runpod/fetch_models.sh --variant fp32 models/embedding
          if grep -qw avx512_vnni /proc/cpuinfo; then
            deploy/runpod/fetch_models.sh --variant int8-vnni "$RUNNER_TEMP/e5-int8"
          else
            echo "no AVX-512 VNNI on this runner: int8 cases will be skipped"
          fi

      - name: embedding variants, real ONNX inference in image (this runner's CPU)
        run: |
          int8=-; [[ -d "$RUNNER_TEMP/e5-int8" ]] && int8="$RUNNER_TEMP/e5-int8"
          deploy/runpod/tests/embedding_in_image.sh cas-aio:${GITHUB_SHA} models/embedding "$int8" deploy/runpod/tests/out/ci-embedding

      - name: CPU smoke
        id: smoke
        run: deploy/runpod/tests/smoke_cpu.sh cas-aio:${GITHUB_SHA}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runpod-image-test-output
          path: deploy/runpod/tests/out/

      # Never push an image whose CPU smoke did not run and pass.
      - name: push to GHCR
        if: steps.smoke.outcome == 'success' && (inputs.push == true || startsWith(github.ref, 'refs/tags/staging-'))
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          img=ghcr.io/${GITHUB_REPOSITORY,,}/cas-aio:${GITHUB_SHA}
          docker tag cas-aio:${GITHUB_SHA} "$img"
          # The tag is the commit SHA: a new commit never overwrites an older image.
          docker push "$img"
          echo "image: $img" >> "$GITHUB_STEP_SUMMARY"
          echo "deploy by digest: $(docker inspect -f '{{index .RepoDigests 0}}' "$img")" >> "$GITHUB_STEP_SUMMARY"
